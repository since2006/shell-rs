# Docker's complaints, where the user can do something about them.
docker.error.permission:
  zh-CN: 没有权限：以 root 登录、把这个用户加入 docker 组，或给它配置免密码的 sudo
  en: "Permission denied: log in as root, add this user to the docker group, or give it passwordless sudo"
