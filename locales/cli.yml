_version: 2

# 外部 CLI: what the `shellrs` command prints, and the messages the app
# sends back to it. CLI output uses plain ASCII quotes and apostrophes, so
# it copies into a shell unchanged; the texts shown in the app's window
# (the settings page, notifications) use “ ” and ’ like the rest of the UI.

# The command could not reach the app.
cli.client.not_running:
  zh-CN: ShellRS 未运行：请先打开 ShellRS，并在 设置 → 外部 CLI 中打开「启用外部 CLI」
  en: ShellRS isn't running. Open ShellRS and turn on Enable external CLI in Settings → External CLI.
cli.client.broken:
  zh-CN: 与 ShellRS 的连接意外中断：%{error}
  en: "The connection to ShellRS broke off: %{error}"
cli.client.no_permission:
  zh-CN: 没有权限连接 ShellRS：Agent 可能运行在沙箱中，需要允许它访问本机的进程间通信
  en: No permission to connect to ShellRS. The agent may be running in a sandbox; allow it local interprocess communication.
cli.client.foreign_pipe:
  zh-CN: 外部 CLI 的管道不属于当前用户，已拒绝连接
  en: The external CLI's pipe belongs to another user, so the connection was refused.
cli.client.older_app:
  zh-CN: 正在运行的 ShellRS 不认识这个命令：请把 ShellRS 升级到最新版本，然后重新启动它
  en: The running ShellRS doesn't know this command. Update ShellRS to the latest version, then restart it.
# Also the app's notification when the server cannot start.
cli.unsupported:
  zh-CN: 此系统暂不支持外部 CLI
  en: The external CLI is not supported on this system.

# Reading the command line and stdin.
cli.exec.empty:
  zh-CN: 命令不能为空
  en: The command is empty.
cli.exec.bad_json:
  zh-CN: 标准输入不是 %{form} 形式的 JSON：%{error}
  en: "The input on stdin isn't JSON of the form %{form}: %{error}"
cli.json.from_terminal:
  zh-CN: 请从标准输入传入 JSON，例如 %{example}
  en: "Pass the JSON on stdin, for example: %{example}"
cli.json.not_json:
  zh-CN: 标准输入不是 JSON：%{error}
  en: "The input on stdin isn't JSON: %{error}"
cli.json.invalid:
  zh-CN: JSON 有误：%{error}
  en: "The JSON is invalid: %{error}"
cli.stdin.unreadable:
  zh-CN: 无法读取标准输入：%{error}
  en: "Couldn't read stdin: %{error}"
cli.path.unresolvable:
  zh-CN: 无法解析路径 %{path}：%{error}
  en: "Couldn't resolve the path %{path}: %{error}"

