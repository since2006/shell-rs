  en: The items’ permissions differ. Bits you leave alone stay as they are.
explorer.properties.links:
  zh-CN: 符号链接没有独立的权限。
  en: Symbolic links have no permissions of their own.
explorer.properties.unsupported:
  zh-CN: 此系统不支持修改权限。
  en: This system doesn’t support changing permissions.
explorer.properties.recursive:
  zh-CN: 同时应用到其中的文件和子目录
  en: Also apply to the files and subfolders inside
explorer.properties.dir_x:
  zh-CN: 为目录添加执行权限（X）
  en: Add execute permission to folders (X)
