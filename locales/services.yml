services.file.disabled:
  zh-CN: 已禁用
  en: Disabled
services.file.static:
  zh-CN: 静态
  en: Static
services.file.masked:
  zh-CN: 已屏蔽
  en: Masked
services.file.generated:
  zh-CN: 自动生成
  en: Generated
services.file.indirect:
  zh-CN: 间接启用
  en: Indirect
services.file.linked:
  zh-CN: 已链接
