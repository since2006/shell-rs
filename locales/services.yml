_version: 2

# 系统服务: a Linux host's systemd services. systemd's states keep the
# words systemd uses.

services.panel.search:
  zh-CN: 搜索服务名称或描述
  en: Search names and descriptions
services.panel.empty:
  zh-CN: 没有服务
  en: No services
services.panel.no_match:
  zh-CN: 没有符合条件的服务
  en: No matching services
services.panel.no_description:
  zh-CN: 无描述
  en: No description
services.panel.not_connected:
  zh-CN: 终端没有连接。连接后这里显示主机的系统服务。
  en: The terminal isn’t connected. Once it is, the host’s services show here.
services.panel.no_systemd:
  zh-CN: 这台主机没有使用 systemd，暂不支持管理它的服务。
  en: This host doesn’t use systemd, so its services can’t be managed yet.
services.panel.unsupported_system:
  zh-CN: 暂不支持管理 %{system} 的服务，目前只支持使用 systemd 的 Linux 主机。
  en: Services on %{system} can’t be managed yet. Only Linux hosts with systemd are supported.
services.panel.unsupported:
  zh-CN: 暂不支持管理这台主机的服务，目前只支持使用 systemd 的 Linux 主机。
  en: This host’s services can’t be managed yet. Only Linux hosts with systemd are supported.
services.group.custom:
  zh-CN: 自定义服务
  en: Custom services
services.group.system:
  zh-CN: 系统服务
  en: System services

services.filter.all:
  zh-CN: 全部
  en: All
services.filter.running:
  zh-CN: 运行中
  en: Active
services.filter.stopped:
  zh-CN: 已停止
  en: Inactive
services.filter.failed:
  zh-CN: 失败
  en: Failed

services.command.start:
  zh-CN: 启动
  en: Start
services.command.stop:
  zh-CN: 停止
  en: Stop
services.command.restart:
  zh-CN: 重启
  en: Restart
services.command.enable:
  zh-CN: 启用开机启动
  en: Enable at boot
services.command.disable:
  zh-CN: 禁用开机启动
  en: Disable at boot

