services.error.needs_root:
  zh-CN: 需要 root 权限：以 root 登录，或给这个用户配置免密码的 sudo
  en: "Needs root: log in as root, or give this user passwordless sudo"
services.error.needs_root_no_sudo:
  zh-CN: 需要 root 权限：这台主机没有 sudo，请以 root 登录
  en: "Needs root: this host has no sudo, so log in as root"
services.error.status:
  zh-CN: systemctl 返回 %{status}
  en: systemctl exited with status %{status}

