forward.status.stopped:
  zh-CN: 已停止
  en: Stopped
forward.status.connecting:
  zh-CN: 正在连接
  en: Connecting
forward.status.running:
  zh-CN: 运行中
  en: Running
forward.status.running_with.one:
  en: Running, %{count} connection
forward.status.running_with.other:
  zh-CN: 运行中，%{count} 个连接
  en: Running, %{count} connections
forward.status.reconnecting:
  zh-CN: 连接中断，正在重连（%{attempt}/%{of}）
  en: Connection lost, reconnecting (%{attempt}/%{of})
forward.status.failed:
  zh-CN: 已停止：%{reason}
  en: "Stopped: %{reason}"

forward.error.start_failed:
  zh-CN: 无法启动端口转发：%{error}
  en: "Couldn’t start the port forward: %{error}"
forward.error.ended:
  zh-CN: 端口转发意外中止
  en: The port forward stopped unexpectedly
forward.error.reconnect_failed:
  zh-CN: 连接中断，自动重连失败：%{reason}
  en: "The connection was lost and couldn’t be restored: %{reason}"
forward.error.connection_lost:
  zh-CN: 与服务器的连接已中断
  en: The connection to the server was lost
forward.error.reconnects_used.one:
  en: The connection was lost, and %{count} attempt to reconnect failed
forward.error.reconnects_used.other:
  zh-CN: 连接中断，重连 %{count} 次均未成功
  en: The connection was lost, and all %{count} attempts to reconnect failed
forward.error.remote_listen:
  zh-CN: 服务器拒绝在 %{bind} 上监听：端口可能已被占用、1024 以下的端口需要 root，或服务器禁用了端口转发（AllowTcpForwarding）
  en: "The server refused to listen on %{bind}: the port may be in use, a port below 1024 needs root, or the server has port forwarding turned off (AllowTcpForwarding)"
forward.error.key_changed:
  zh-CN: 主机密钥与已保存的不一致，已阻止连接。请先核实服务器身份
  en: The host key doesn’t match the saved one, so the connection was blocked. Verify the server’s identity first.
forward.error.unknown_key:
  zh-CN: 尚未信任该主机的密钥，请手动启动以确认
  en: The host’s key isn’t trusted yet. Start the forward yourself to confirm it.
forward.error.needs_password:
  zh-CN: 需要输入密码，请手动启动
  en: A password is needed. Start the forward yourself to enter it.
forward.error.needs_passphrase:
  zh-CN: 需要输入私钥口令，请手动启动
  en: A passphrase is needed. Start the forward yourself to enter it.
forward.error.needs_interactive:
  zh-CN: 服务器要求交互式认证，请手动启动
  en: The server asks for interactive authentication. Start the forward yourself to answer it.
forward.error.unresolved_bind:
  zh-CN: 无法解析监听地址 %{host}
  en: Couldn’t resolve the listening address %{host}
forward.error.port_in_use:
  zh-CN: 本机端口 %{port} 已被占用
  en: Port %{port} on this computer is already in use
forward.error.port_denied:
  zh-CN: 没有权限监听端口 %{port}（1024 以下的端口需要管理员权限）
  en: No permission to listen on port %{port} (ports below 1024 need administrator rights)
forward.error.no_such_address:
  zh-CN: 本机没有地址 %{host}，无法监听
  en: This computer has no address %{host} to listen on
forward.error.bind_failed:
  zh-CN: 无法监听 %{bind}：%{error}
  en: "Couldn’t listen on %{bind}: %{error}"
forward.error.not_socks:
  zh-CN: 收到的不是 SOCKS 请求，请把应用的代理类型设为 SOCKS5
  en: This isn’t a SOCKS request. Set the app’s proxy type to SOCKS5.
forward.error.local_refused:
  zh-CN: 连接被拒绝，该端口上没有服务在监听
  en: connection refused, as nothing is listening on that port
forward.error.local_timed_out:
  zh-CN: 连接超时
  en: the connection timed out
forward.error.local_target_failed:
  zh-CN: 无法连接本机目标 %{target}：%{reason}
  en: "Couldn’t connect to %{target} on this computer: %{reason}"
forward.error.server_timed_out:
  zh-CN: 服务器连接 %{target} 超时
  en: The server timed out connecting to %{target}
forward.error.prohibited:
  zh-CN: 服务器禁止转发到 %{target}（AllowTcpForwarding 或 PermitOpen 限制）
  en: The server doesn’t allow forwarding to %{target} (AllowTcpForwarding or PermitOpen)
forward.error.server_connect_failed:
  zh-CN: 服务器无法连接 %{target}
  en: The server couldn’t connect to %{target}
forward.error.unsupported:
  zh-CN: 服务器不支持端口转发
  en: The server doesn’t support port forwarding
forward.error.resource_shortage:
  zh-CN: 服务器资源不足，无法建立转发连接
  en: The server is short of resources and couldn’t open the connection
forward.error.refused:
  zh-CN: 服务器拒绝了到 %{target} 的连接
  en: The server refused the connection to %{target}
