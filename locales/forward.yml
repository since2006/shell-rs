  en: Choose a host
forward.dialog.host_option:
  zh-CN: "%{name}（%{endpoint}）"
  en: "%{name} (%{endpoint})"
forward.dialog.bind_local:
  zh-CN: 本机监听地址
  en: Listen on this computer
forward.dialog.bind_server:
  zh-CN: 服务器监听地址
  en: Listen on the server
forward.dialog.bind_socks:
  zh-CN: 本机监听地址（SOCKS 代理）
  en: Listen on this computer (SOCKS proxy)
forward.dialog.target_from_server:
  zh-CN: 目标地址（从服务器访问）
  en: Destination (as the server reaches it)
forward.dialog.target_from_local:
  zh-CN: 目标地址（从本机访问）
  en: Destination (as this computer reaches it)
forward.dialog.port:
  zh-CN: 端口
  en: Port
forward.dialog.target_placeholder:
  zh-CN: 例如 db.internal 或 127.0.0.1
  en: e.g. db.internal or 127.0.0.1
forward.dialog.target_placeholder_remote:
  zh-CN: 例如 localhost
  en: e.g. localhost
forward.dialog.auto_start:
  zh-CN: 启动 ShellRS 时自动开启
  en: Start when ShellRS opens
forward.dialog.gateway_ports_note:
  zh-CN: 服务器的 sshd_config 需设置 GatewayPorts clientspecified 或 yes，其他机器才连得上；默认是 no，这时转发照常运行，但只监听服务器自己的 127.0.0.1。
  en: Other machines can connect only if the server’s sshd_config sets GatewayPorts to clientspecified or yes. With the default, no, the forward still runs but listens only on the server’s own 127.0.0.1.
forward.dialog.not_loopback_note:
  zh-CN: 监听地址不是本机回环地址，同一网络中的其他设备也能使用这个转发。
  en: The listening address isn’t a loopback address, so other devices on the same network can use this forward too.
forward.dialog.privileged_port_remote:
  zh-CN: 服务器上 1024 以下的端口需要以 root 登录才能监听。
  en: Listening on a port below 1024 on the server takes logging in as root.
forward.dialog.privileged_port:
  zh-CN: 1024 以下的端口通常需要管理员权限才能监听。
  en: Listening on a port below 1024 usually takes administrator rights.
forward.dialog.restart_note:
  zh-CN: 这条转发正在运行，改动监听或目标后会按新设置重新启动。
  en: This forward is running. Changing where it listens or connects restarts it with the new settings.
forward.dialog.choose_host_error:
  zh-CN: 请选择端口转发经由的主机
  en: Choose the host to forward through
forward.dialog.host_gone:
  zh-CN: 所选主机已不存在，请重新选择
  en: The chosen host no longer exists. Choose another.

