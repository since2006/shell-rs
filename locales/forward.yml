_version: 2

# 端口转发: the forward list, its dialog and the forwards running.

forward.diagram.local:
  zh-CN: 本机
  en: This computer
forward.diagram.server:
  zh-CN: SSH 服务器
  en: SSH server
forward.diagram.target_service:
  zh-CN: 目标服务
  en: Service
forward.diagram.anywhere:
  zh-CN: 任意地址
  en: Any address
forward.diagram.entrance:
  zh-CN: 隧道入口
  en: Tunnel entrance
forward.diagram.exit:
  zh-CN: 隧道出口
  en: Tunnel exit
forward.diagram.target:
  zh-CN: 目标
  en: Destination
forward.diagram.listens:
  zh-CN: 监听 %{bind}
  en: Listens on %{bind}
forward.diagram.connects_onward:
  zh-CN: 代为连接目标
  en: Connects onward
forward.diagram.app_chooses:
  zh-CN: 由应用指定
  en: Chosen by the app
forward.diagram.tunnel:
  zh-CN: SSH 隧道
  en: SSH tunnel
forward.diagram.plain:
  zh-CN: 普通连接
  en: Plain TCP

forward.explain.local:
  zh-CN: 在本机连接 %{bind}，就等于从 SSH 服务器连接 %{target}。
  en: Connecting to %{bind} on this computer is the same as connecting to %{target} from the SSH server.
forward.explain.remote:
  zh-CN: 在 SSH 服务器上连接 %{bind}，就等于从本机连接 %{target}。
  en: Connecting to %{bind} on the SSH server is the same as connecting to %{target} from this computer.
forward.explain.dynamic:
  zh-CN: 把应用的 SOCKS5 代理设为 %{bind}，它的连接都从 SSH 服务器发出。
  en: Set an app’s SOCKS5 proxy to %{bind}, and its connections go out from the SSH server.

forward.purpose.local:
  zh-CN: 在本机访问服务器那边的服务
  en: Reach a service on the server’s side
forward.purpose.remote:
  zh-CN: 让服务器那边访问本机的服务
  en: Let the server’s side reach a service here
forward.purpose.dynamic:
  zh-CN: 把服务器当作 SOCKS 代理
  en: Use the server as a SOCKS proxy

forward.typical_use.local:
  zh-CN: 常见用途：用本机的客户端连接只对服务器开放的数据库或内网后台。
  en: "Typical use: connect a client here to a database or internal admin site that only the server can reach."
forward.typical_use.remote:
  zh-CN: 常见用途：把本机正在开发的服务给服务器那边访问，或接收 Webhook。
  en: "Typical use: let the server’s side reach a service you’re developing here, or receive webhooks."
forward.typical_use.dynamic:
  zh-CN: 常见用途：让浏览器经由服务器上网，不必为每个地址单独建转发。
  en: "Typical use: browse through the server without a forward for each address."

forward.dialog.title_new:
