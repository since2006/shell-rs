  zh-CN: "%{tokens} tokens"
  en: "%{tokens} tokens"
assistant.panel.usage_unknown:
  zh-CN: 这个模型服务没有返回用量
  en: This model service doesn’t report usage
assistant.panel.usage_detail:
  zh-CN: 输入 %{input} · 输出 %{output} · 缓存读取 %{cache_read} · 缓存写入 %{cache_write}
