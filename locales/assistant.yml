  en: "%{provider} · %{model}"
assistant.panel.add_provider:
  zh-CN: 添加模型服务…
  en: Add model service…
assistant.panel.retrying:
  zh-CN: 重试中（%{attempt}/%{of}）…
  en: Retrying (%{attempt}/%{of})…
assistant.panel.approval_title:
  zh-CN: 应如何批准 AI 助手的操作？
  en: How should actions be approved?
assistant.panel.continue:
  zh-CN: 继续
  en: Continue
assistant.panel.continue_message:
  zh-CN: 继续
  en: Continue
