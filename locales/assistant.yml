  en: Input %{input} · output %{output} · cache read %{cache_read} · cache write %{cache_write} · context %{context} / %{window}

assistant.call.read_terminal:
  zh-CN: 读取终端最后 %{lines} 行
  en: Read the terminal’s last %{lines} lines
assistant.call.read_file:
  zh-CN: 读取文件 %{path}
  en: Read %{path}
assistant.call.asking:
  zh-CN: 等你确认
  en: Waiting for you
assistant.call.running:
  zh-CN: 执行中…
  en: Running…
assistant.call.done:
  zh-CN: 完成
  en: Done
assistant.call.failed:
  zh-CN: 失败
  en: Failed
assistant.call.denied:
  zh-CN: 已拒绝
  en: Declined
assistant.call.cancelled:
  zh-CN: 已取消
  en: Cancelled
assistant.call.dangerous:
  zh-CN: 这条命令可能删除、改写或停止服务器上的东西，请看清再执行。
  en: This command may delete, overwrite or stop things on the server. Check it before you run it.
assistant.call.run:
  zh-CN: 执行
  en: Run
assistant.call.run_always_similar:
  zh-CN: 执行，本对话不再问相似命令
  en: Run and don’t ask again here about similar commands
assistant.call.run_always_similar_tip:
  zh-CN: 之后本对话里的 %{kinds} 命令都直接执行
  en: Later %{kinds} commands in this conversation run without asking
assistant.call.run_always_command:
  zh-CN: 执行，本对话不再问这条命令
  en: Run and don’t ask again here about this command
assistant.call.run_always_file:
  zh-CN: 执行，本对话不再问这个文件
  en: Run and don’t ask again here about this file
assistant.call.insert:
  zh-CN: 插入终端
