assistant.delete_provider.title:
  zh-CN: 删除模型服务“%{name}”？
  en: Delete the model service “%{name}”?
assistant.delete_provider.description:
  zh-CN: 它的 API Key 也会从钥匙串删除，开启同步时其他设备上的也会删除。用过它的对话还在。
  en: Its API key is deleted from the keychain too, and from your other devices with sync on. Conversations that used it stay.
assistant.delete_all.title:
  zh-CN: 删除全部对话？
  en: Delete all conversations?
assistant.delete_all.description:
  zh-CN: AI 助手在这台电脑上保存的对话都会删除，不能恢复。
  en: Every AI assistant conversation saved on this computer is deleted. This can’t be undone.
assistant.delete_all.confirm:
  zh-CN: 删除全部对话
  en: Delete all conversations
assistant.full_access.title:
  zh-CN: 改为完全访问权限？
  en: Switch to full access?
assistant.full_access.description:
  zh-CN: 模型执行任何命令、读取任何文件都不再询问，包括删除文件、停止服务和重启。服务器上的内容可能诱导模型做这些事。
  en: The model then runs any command and reads any file without asking, deleting files, stopping services and rebooting included. What’s on the server can lead the model to do these things.
assistant.full_access.confirm:
  zh-CN: 改为完全访问权限
  en: Switch to full access
