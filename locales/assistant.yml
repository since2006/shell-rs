  zh-CN: AI 助手还没有启用。到「设置 › AI 助手」添加模型服务，再打开「启用 AI 助手」。
  en: The AI assistant is off. In Settings › AI assistant, add a model service, then turn on Enable AI assistant.
assistant.panel.open_settings:
  zh-CN: 打开设置
  en: Open settings
assistant.panel.no_provider:
  zh-CN: 还没有模型服务。添加一个，就能在这里问这台主机的事。
  en: There’s no model service yet. Add one to ask about this host here.
assistant.panel.no_provider_short:
