  en: Ask about this host…
assistant.panel.send:
  zh-CN: 发送
  en: Send
assistant.panel.stop:
  zh-CN: 停止
  en: Stop
assistant.panel.thinking:
  zh-CN: 正在思考…
  en: Thinking…
assistant.panel.new:
  zh-CN: 新建对话
  en: New conversation
assistant.panel.new_title:
  zh-CN: 新对话
  en: New conversation
assistant.panel.untitled:
  zh-CN: （未命名）
  en: (Untitled)
assistant.panel.history:
  zh-CN: 历史对话
  en: Conversations
