assistant.turn.refused:
  zh-CN: 模型拒绝了这个请求。
  en: The model declined this request.
assistant.turn.stopped:
  zh-CN: 已停止。
  en: Stopped.
assistant.turn.trimmed:
  zh-CN: 较早的工具输出已不再发送，以节省空间。
  en: Older tool output is no longer sent, to save room.
assistant.turn.step_limit:
  zh-CN: 这一轮已经执行了很多步，要继续吗？
  en: This turn has taken many steps. Continue?
assistant.turn.max_tokens:
  zh-CN: 回答达到了长度上限，可以让它继续。
  en: The answer reached its length limit. You can let it continue.
assistant.turn.context_full:
  zh-CN: 这个对话太长了，模型装不下。请新建一个对话。
  en: This conversation is too long for the model. Start a new conversation.

assistant.error.key_rejected:
  zh-CN: API Key 被拒绝：检查 Key 是否正确、是否有权使用这个模型
  en: The API key was rejected. Check that it’s right and allowed to use this model
assistant.error.not_found:
  zh-CN: 地址或模型名不对
  en: The address or the model name is wrong
assistant.error.quota:
  zh-CN: 账户余额或额度用完了
  en: The account is out of balance or quota
assistant.error.rate_limited:
  zh-CN: 请求太频繁，稍后再试
  en: Too many requests. Try again later
assistant.error.overloaded:
  zh-CN: 模型服务繁忙，稍后再试
  en: The model service is busy. Try again later
assistant.error.context:
  zh-CN: 对话太长，模型装不下，请新建对话
  en: The conversation is too long for the model. Start a new conversation
assistant.error.bad_request:
  zh-CN: 模型服务拒绝了这个请求
  en: The model service refused the request
assistant.error.server:
  zh-CN: 模型服务出错了
  en: The model service failed
assistant.error.network:
  zh-CN: 连不上模型服务
  en: Couldn’t reach the model service
assistant.error.timeout:
  zh-CN: 模型服务响应超时
  en: The model service took too long to answer
assistant.error.protocol:
  zh-CN: 模型服务的回答看不懂：检查地址和协议
  en: The model service’s answer couldn’t be read. Check the address and the protocol
assistant.error.with_detail:
  zh-CN: "%{what}（%{detail}）"
  en: "%{what} (%{detail})"
assistant.error.store:
  zh-CN: 对话未能保存：%{error}
  en: "Couldn’t save the conversation: %{error}"
assistant.error.conversation_gone:
  zh-CN: 这个对话已经不在了
  en: This conversation is gone

assistant.run.not_connected:
  zh-CN: 终端没有连接
  en: The terminal isn’t connected
assistant.run.no_terminal:
  zh-CN: 终端已经关闭
  en: The terminal was closed
assistant.run.no_files:
  zh-CN: 这里不能读取文件
  en: Files can’t be read here
assistant.run.unknown_shell:
  zh-CN: 认不出终端里的 shell：在终端中执行只支持 Linux 上的 bash、dash 和 busybox
  en: Couldn’t tell the terminal’s shell. Running in the terminal works with bash, dash and busybox on Linux
assistant.run.unsupported_shell:
  zh-CN: 终端里的 shell 是 %{shell}：在终端中执行只支持 bash、dash 和 busybox
  en: The terminal’s shell is %{shell}. Running in the terminal works with bash, dash and busybox
assistant.run.too_long:
  zh-CN: 命令太长，在终端中执行最多 %{limit} 字节
  en: The command is too long. Running in the terminal takes at most %{limit} bytes
assistant.run.full_screen:
  zh-CN: 终端里有全屏程序在运行
  en: A full-screen program is running in the terminal
assistant.run.another_run:
  zh-CN: 终端里已有另一条命令在执行
  en: Another command is running in the terminal
assistant.run.transfer:
  zh-CN: 终端正在用 ZMODEM 传文件
  en: The terminal is transferring files with ZMODEM
assistant.run.no_answer:
  zh-CN: 终端里的 shell 没有响应：它可能正忙
  en: The terminal’s shell didn’t answer. It may be busy
assistant.run.disconnected:
  zh-CN: 命令执行时终端断开了：它可能只执行了一部分
  en: The terminal went away while the command ran. It may have run in part
assistant.run.not_started:
  zh-CN: 无法开始执行
  en: Couldn’t start running it

assistant.service.failed:
  zh-CN: AI 助手无法启动：%{error}
  en: "AI assistant couldn’t start: %{error}"
assistant.service.no_thread:
  zh-CN: AI 助手无法启动后台线程
  en: AI assistant couldn’t start its background thread
assistant.service.unavailable:
  zh-CN: AI 助手现在不可用
  en: AI assistant isn’t available now


