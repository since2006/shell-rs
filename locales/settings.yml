  zh-CN: 主题
  en: Theme
settings.appearance.theme_description:
  zh-CN: 浅色外观时用左栏选中的主题，深色外观时用右栏的。
  en: The light appearance uses the theme chosen on the left, the dark appearance the one on the right.

