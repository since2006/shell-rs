settings.interaction.title:
  zh-CN: 终端交互
  en: Interaction
settings.interaction.copy_on_select:
  zh-CN: 选中复制
  en: Copy on select
settings.interaction.copy_on_select_description:
  zh-CN: 选中文本自动进入系统剪贴板，无需按快捷键。
  en: Selected text is copied to the clipboard without pressing a shortcut.
settings.interaction.right_click:
  zh-CN: 右键行为
  en: Right-click
settings.interaction.right_click_description:
  zh-CN: 设置鼠标右键在终端中的行为。
  en: What right-clicking in a terminal does.
settings.right_click.nothing:
  zh-CN: 无动作
  en: Do nothing
settings.right_click.paste:
  zh-CN: 粘贴
  en: Paste
settings.right_click.menu:
  zh-CN: 显示菜单
  en: Show menu

settings.sidebar_tools.title:
  zh-CN: 侧栏功能
  en: Sidebar tools
settings.sidebar_tools.description:
  zh-CN: 点击图标，或把它拖到另一排，即可显示或隐藏。主机系统用不了的工具不显示，例如 Windows 主机上的系统监控；外部调用打开的连接只显示命令片段；本地终端旁只有项目。
  en: Click an icon, or drag it to the other row, to show or hide it. A tool the host’s system can’t run doesn’t appear, such as Monitor on a Windows host; an external connection shows only Snippets, and local terminals have only Projects.
settings.sidebar_tools.reset:
  zh-CN: 恢复默认
  en: Restore defaults
settings.sidebar_tools.shown:
  zh-CN: 显示在右侧栏
  en: In the sidebar
settings.sidebar_tools.hidden:
  zh-CN: 不显示
  en: Not shown
settings.sidebar_tools.shown_empty:
  zh-CN: 所有工具都已隐藏，右侧栏不会出现。把图标拖到这里即可显示。
  en: Every tool is hidden, so the right sidebar doesn’t appear. Drag an icon here to show it.
settings.sidebar_tools.hidden_empty:
  zh-CN: 不用的工具可以拖到这里，或点一下它的图标。
  en: Drag a tool you don’t use here, or click its icon.
settings.sidebar_tools.click_to_hide:
  zh-CN: 点击或拖到「不显示」即可隐藏
  en: Click, or drag to “Not shown”, to hide it
settings.sidebar_tools.click_to_show:
  zh-CN: 点击或拖到「显示在右侧栏」即可显示
  en: Click, or drag to “In the sidebar”, to show it
settings.sidebar_tools.snippets:
  zh-CN: 保存常用命令，点一下输入或执行。
  en: Commands you keep, typed or run with a click.
settings.sidebar_tools.history:
  zh-CN: 主机上 bash 的历史命令。
  en: The host’s bash history.
settings.sidebar_tools.files:
  zh-CN: 终端连接上的远程文件列表，可以跟随终端目录。
  en: The host’s files over the terminal’s connection, following its folder.
settings.sidebar_tools.tmux:
  zh-CN: 主机上的 tmux 会话：新建、连接、退出、重命名和结束。
  en: The host’s tmux sessions, to start, attach, detach, rename and end.
settings.sidebar_tools.docker:
  zh-CN: 容器、卷、镜像和网络。
  en: Containers, volumes, images and networks.
settings.sidebar_tools.kubernetes:
  zh-CN: 用主机上的 kubectl 浏览集群资源、关联关系和容器日志。
  en: Cluster resources, how they relate and container logs, through kubectl on the host.
settings.sidebar_tools.services:
  zh-CN: systemd 服务的状态和启停。
  en: systemd services, and starting and stopping them.
settings.sidebar_tools.processes:
  zh-CN: 进程的内存和 CPU，可以结束进程。
  en: Processes with their memory and CPU, and ending them.
settings.sidebar_tools.connections:
  zh-CN: TCP、UDP 连接和监听端口。
  en: TCP and UDP connections and listening ports.
settings.sidebar_tools.monitor:
  zh-CN: CPU、内存、网络和磁盘。
  en: CPU, memory, network and disks.
settings.sidebar_tools.gpu:
  zh-CN: AI 主机的 GPU 和 NPU：利用率、显存、温度和计算进程。支持 NVIDIA 和华为昇腾。
  en: An AI host’s GPUs and NPUs, with their utilization, memory, temperature and compute processes. NVIDIA and Huawei Ascend.
settings.sidebar_tools.projects:
  zh-CN: 本地终端旁的分组：把本地终端分组保存，退出时开着的下次启动在原来的文件夹重新打开。
  en: Beside local terminals, groups to keep local terminals in. Those open when you quit come back in their folders next launch.
settings.sidebar_tools.keywords:
  zh-CN: 侧栏,右侧栏,工具,显示,隐藏,显卡,GPU,NPU,项目
  en: sidebar,tools,show,hide,GPU,NPU,projects

settings.notifications.title:
  zh-CN: 通知
  en: Notifications
settings.notifications.description:
  zh-CN: ShellRS 不在前台时发系统通知；在前台但终端在别的标签时，在窗口右上角提示，点一下切过去。
  en: When ShellRS is in the background, you get a system notification. When it’s in front but the terminal is in another tab, a notice appears at the top right of the window; click it to go there.
settings.notifications.programs:
  zh-CN: 程序发送的通知
  en: Notifications from programs
settings.notifications.programs_description:
  zh-CN: 远程或本地程序用 OSC 9 / 777 请求的通知，例如 printf '\e]9;完成\a'。
  en: Notifications that remote or local programs ask for with OSC 9 / 777, for example printf '\e]9;Done\a'.
settings.notifications.bell:
  zh-CN: 响铃时通知
  en: Notify on bell
settings.notifications.bell_description:
  zh-CN: 终端就在当前标签时不提示。
  en: Not when the terminal is the current tab.

# 终端 › 本地终端.
settings.local_terminal.title:
  zh-CN: 本地终端
  en: Local terminal
settings.local_terminal.shell:
  zh-CN: Shell
  en: Shell
settings.local_terminal.shell_description:
  zh-CN: 新开或重新启动的本地终端运行的程序：路径或命令，可以带参数。留空时自动检测系统默认的 shell。
  en: "The program new and restarted local terminals run: a path or a command, with any arguments. Leave it empty to use the system’s default shell."
# The empty field and the first choice of its menu, with the shell that
# runs: 「自动检测（/bin/zsh）」.
settings.local_terminal.automatic:
  zh-CN: 自动检测（%{shell}）
  en: Automatic (%{shell})
# The same before the default shell is known.
settings.local_terminal.automatic_unknown:
  zh-CN: 自动检测
  en: Automatic
settings.local_terminal.installed:
  zh-CN: 已安装的 shell
  en: Installed shells
settings.local_terminal.browse:
  zh-CN: 选择文件…
  en: Choose file…
settings.local_terminal.browse_prompt:
  zh-CN: 选择 shell
  en: Choose a shell
settings.local_terminal.keywords:
  zh-CN: shell,本地终端,命令,参数,bash,zsh,fish,PowerShell,cmd
  en: shell,local terminal,command,arguments,bash,zsh,fish,PowerShell,cmd
settings.local_terminal.keep_output:
  zh-CN: 保留终端内容
  en: Keep terminal output
settings.local_terminal.keep_output_description:
  zh-CN: 「项目」里的本地终端关闭或退出 ShellRS 时，记下最后 1000 行输出，下次打开时先显示出来。内容以明文存在本机的数据目录里；关掉会同时删除已保留的内容。
  en: When a local terminal in Projects closes, or ShellRS quits, its last 1,000 lines of output are kept and shown again when it next opens. They’re stored as plain text in the data folder on this computer; turning this off deletes them.
settings.local_terminal.keep_output_keywords:
  zh-CN: 保留,内容,输出,回滚,历史,恢复,项目
  en: keep,output,scrollback,history,restore,projects

# 终端 › 发送延迟.
settings.send_delay.title:
  zh-CN: 发送延迟
  en: Send delays
settings.send_delay.description:
  zh-CN: 粘贴多行文本或用「发送命令」时，按这里等待后再发下一行、下一个字符，慢速设备才不会丢字。都是 0 时整段一次发出，与以前一样；键盘输入不受影响。
  en: When pasting several lines or using Send Commands, wait this long before the next line or character so slow equipment hears every one. At 0 the text goes in one write, as before; typing is never delayed.
settings.send_delay.line:
  zh-CN: 行延迟
  en: Line delay
settings.send_delay.line_description:
  zh-CN: 每行发送后等待的毫秒数。
  en: Milliseconds to wait after each line’s Enter.
settings.send_delay.line_keywords:
  zh-CN: 行延迟,粘贴,脚本,慢,设备,毫秒
  en: line delay,paste,script,slow,device,milliseconds
settings.send_delay.character:
  zh-CN: 字符延迟
  en: Character delay
settings.send_delay.character_description:
  zh-CN: 同一行里每个字符之间等待的毫秒数。
  en: Milliseconds to wait between two characters of a line.
settings.send_delay.character_keywords:
  zh-CN: 字符延迟,逐字,粘贴,慢,设备,毫秒
  en: character delay,per character,paste,slow,device,milliseconds

# 终端 › 会话日志.
settings.session_log.title:
  zh-CN: 会话日志
  en: Session log
settings.session_log.description:
  zh-CN: 把连接建立的会话输出去掉颜色和光标控制后写入文件。设置只对之后新建或重连的会话生效。
  en: A connection’s output is written to a file without colours or cursor control. Changes apply to terminals opened or reconnected from then on.
settings.session_log.enabled:
  zh-CN: 记录会话日志
  en: Log sessions
settings.session_log.enabled_description:
  zh-CN: 新建立或重连的每个会话都记录，包括本地终端。
  en: Every session started or reconnected from now on is logged, local terminals included.
settings.session_log.enabled_keywords:
  zh-CN: 日志,记录,保存,会话,输出
  en: log,record,save,session,output
settings.session_log.directory:
  zh-CN: 保存目录
  en: Folder
settings.session_log.directory_description:
  zh-CN: 日志放在哪里。留空时用数据目录下的 logs。
  en: Where logs go. Empty uses the logs folder in the data folder.
settings.session_log.directory_keywords:
  zh-CN: 目录,文件夹,路径,保存
  en: folder,directory,path,save
settings.session_log.browse:
  zh-CN: 选择目录…
  en: Choose folder…
settings.session_log.browse_prompt:
  zh-CN: 选择日志保存目录
  en: Choose a folder for logs
settings.session_log.template:
  zh-CN: 文件名模板
  en: File name
settings.session_log.template_description:
  zh-CN: 相对保存目录的路径，可用子目录。占位符：%Y 年、%M 月、%D 日、%h 时、%m 分、%s 秒、%H 地址、%S 主机名、%% 百分号。注意 %M 是月，%m 是分。
  en: "The path under the folder; it may hold subfolders. Placeholders: %Y year, %M month, %D day, %h hour, %m minute, %s second, %H address, %S host name, %% percent sign. Note %M is the month and %m the minute."
settings.session_log.template_keywords:
  zh-CN: 文件名,模板,占位符,年月日,时间,主机名,地址,命名
  en: file name,template,placeholder,date,time,host name,address,naming
settings.session_log.timestamp:
  zh-CN: 每行时间戳
  en: Line timestamps
settings.session_log.timestamp_description:
  zh-CN: 每行开头写上这一行开始的时间。
  en: Each line starts with the time it began.
settings.session_log.timestamp_keywords:
  zh-CN: 时间戳,时间,每行
  en: timestamp,time,line
settings.session_log.timestamp_format:
  zh-CN: 时间戳格式
  en: Timestamp format
settings.session_log.timestamp_format_description:
  zh-CN: chrono 的时间格式，例如 [%Y-%m-%d %H:%M:%S] ，这里的 %M 是分钟。格式无效时用默认值。
  en: "A chrono format, such as [%Y-%m-%d %H:%M:%S] ; here %M is the minute. An invalid format falls back to the default."
settings.session_log.timestamp_format_keywords:
  zh-CN: 时间戳,格式,年月日,时分秒
  en: timestamp,format,date,time

settings.sftp.transfers:
  zh-CN: 传输
  en: Transfers
settings.sftp.parallel:
  zh-CN: 最大同时传输数量
  en: Maximum concurrent transfers
settings.sftp.parallel_description:
  zh-CN: 同时进行上传和下载的任务数量，超出的任务将排队等待。
  en: How many uploads and downloads run at the same time. The rest wait in the queue.
settings.sftp.parallel_keywords:
  zh-CN: 同时,并发,并行,上传,下载,队列,速度
  en: concurrent,parallel,simultaneous,upload,download,queue,speed
settings.sftp.file_sidebar:
  zh-CN: 文件侧栏
  en: Files sidebar
settings.sftp.detect_follow:
  zh-CN: 自动检测目录配置
  en: Detect folder reporting
settings.sftp.detect_follow_description:
  zh-CN: 打开「文件」侧栏时，自动检测远端 shell 是否已配置目录跟随，未配置时提示自动安装。
  en: When the Files sidebar opens, check whether the host’s shell reports its folder for Files to follow, and offer to set it up if not.
settings.sftp.follow_keywords:
  zh-CN: 目录跟随,文件,侧栏,当前目录,OSC 7,bashrc,zshrc
  en: follow,folder,files,sidebar,current directory,OSC 7,bashrc,zshrc
settings.sftp.file_list:
  zh-CN: 文件列表
  en: File list
settings.sftp.icon_style:
  zh-CN: 图标风格
  en: Icon style
settings.sftp.icon_style_description:
  zh-CN: 彩色图标按文件类型和常见的文件夹名区分。
  en: Color icons tell file types and common folder names apart.
settings.sftp.preview_folder:
  zh-CN: 文件夹
  en: Folder
settings.sftp.preview_file:
  zh-CN: 普通文件
  en: File
settings.sftp.keywords:
  zh-CN: 图标,彩色,单色,文件,文件夹,预览
  en: icons,color,monochrome,files,folders,preview
settings.file_icons.monochrome:
  zh-CN: 单色
  en: Monochrome
settings.file_icons.color:
  zh-CN: 彩色
  en: Color

settings.highlight.options:
  zh-CN: 常规
  en: Options
settings.highlight.enabled:
  zh-CN: 启用关键字高亮
  en: Highlight keywords
settings.highlight.enabled_description:
  zh-CN: 全屏程序（vim、less、tmux 等）里不高亮。
  en: Not in full-screen programs such as vim, less and tmux.
settings.highlight.preview_description:
  zh-CN: 使用当前终端主题
  en: In the current terminal theme
settings.highlight.preview_keywords:
  zh-CN: 预览,高亮
  en: preview,highlight
settings.highlight.rules:
  zh-CN: 规则（%{count}）
  en: Rules (%{count})
settings.highlight.rules_description:
  zh-CN: 规则按从上到下应用，勾选「通知」的规则在看不到终端时弹出提醒。
  en: Rules apply from top to bottom. A rule with Notify checked alerts you when its terminal isn’t in view.
settings.highlight.rules_keywords:
  zh-CN: 规则,正则,关键字,高亮,颜色,备注,通知,排序
  en: rule,regex,keyword,highlight,color,note,notify,order

settings.window.title:
  zh-CN: 窗口
  en: Window
settings.window.remember_size:
  zh-CN: 记住窗口大小
  en: Remember window size
settings.window.remember_size_description:
  zh-CN: 下次启动时恢复上次关闭时的窗口大小和最大化状态。
  en: The next launch restores the window’s size, maximized or not, as it was when it closed.
settings.window.remember_position:
  zh-CN: 记住窗口位置
  en: Remember window position
settings.window.remember_position_description:
  zh-CN: 下次启动时把窗口放回上次所在的屏幕和位置；那块屏幕不在时放在主屏幕中间。
  en: The next launch puts the window back on the same screen and in the same place. If that screen is gone, it opens in the middle of the main screen.

settings.cli.access:
  zh-CN: 访问控制
  en: Access
settings.cli.enabled:
  zh-CN: 启用外部 CLI
  en: Enable external CLI
settings.cli.enabled_description:
  zh-CN: 开启后，本机当前用户下的程序（如 AI Agent）可以通过 shellrs 命令，在已保存的主机上执行命令、传输和同步文件，并查看、新建、修改和删除主机与凭据，无需知道密码。
  en: When on, programs running as you on this computer, such as AI agents, can use the shellrs command to run commands and transfer and sync files on saved hosts, and to view, create, change and delete hosts and credentials, without knowing any password.
settings.cli.binary:
  zh-CN: CLI 二进制
  en: Command
settings.cli.binary_description:
  zh-CN: 把 shellrs 命令加入 PATH，方便在终端和 Agent 中直接调用。
  en: Puts the shellrs command on the PATH so terminals and agents can call it directly.
settings.cli.binary_description_windows:
  zh-CN: 把 shellrs 命令加入当前用户的 PATH，方便在终端和 Agent 中直接调用。重新打开的终端和 Agent 才能找到它。
  en: Puts the shellrs command on your user PATH so terminals and agents can call it directly. Terminals and agents find it once reopened.
settings.cli.binary_description_portable:
  zh-CN: 把 shellrs 命令复制到 ShellRS 文件夹里的 bin，并把它加入当前用户的 PATH，方便在终端和 Agent 中直接调用。重新打开的终端和 Agent 才能找到它。移动 ShellRS 文件夹或盘符变了以后，要再安装一次。
  en: Copies the shellrs command into the bin folder inside the ShellRS folder and puts it on your user PATH so terminals and agents can call it directly. Terminals and agents find it once reopened. After moving the ShellRS folder or a change of drive letter, install it again.
settings.cli.skills_description:
  zh-CN: 安装 shellrs skill，让外部 Agent 在连接服务器、执行远程命令和传输文件时使用 shellrs CLI。可安装到通用目录或指定 Agent 的专用目录。
  en: Install the shellrs skill so agents use the shellrs CLI to connect to servers, run remote commands and transfer files. Install it to the shared folder or to a particular agent’s own folder.
settings.cli.status:
  zh-CN: 状态：
  en: "Status:"
settings.cli.checking:
  zh-CN: 正在检查…
  en: Checking…
settings.cli.binary_unsupported:
  zh-CN: 此系统暂不支持安装 shellrs 命令
  en: The shellrs command can’t be installed on this system yet
settings.cli.skill_unsupported:
  zh-CN: 此系统暂不支持安装
  en: Can’t be installed on this system yet
settings.cli.missing:
  zh-CN: 未安装（%{path}）
  en: Not installed (%{path})
settings.cli.outdated:
  zh-CN: 已安装旧版本（%{path}）
