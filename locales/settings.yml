settings.store.unreadable:
  zh-CN: 无法读取设置，本次使用默认设置：%{error}
  en: "Couldn’t read the settings, so this session uses the defaults: %{error}"
settings.store.unsaved:
  zh-CN: 无法保存设置，本次运行的改动不会被保存：%{error}
  en: "Settings can’t be saved, so changes last only until ShellRS quits: %{error}"
settings.store.save_failed:
  zh-CN: 无法保存设置：%{error}
  en: "Couldn’t save the settings: %{error}"

