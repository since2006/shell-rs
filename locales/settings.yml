  zh-CN: 界面跟随主题
  en: Match interface to theme
settings.theme.app_follows_description:
  zh-CN: 关闭时界面用中性的黑白灰，只有终端按所选主题配色。
  en: When off, the interface stays neutral black, white and gray, and only terminals take the theme’s colors.
