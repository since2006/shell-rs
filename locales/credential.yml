_version: 2

# 凭据: the credential list and the dialog that edits a credential.

credential.key_source.file:
  zh-CN: 本机文件
  en: Local file
credential.key_source.paste:
  zh-CN: 粘贴
  en: Paste
credential.key_source.generate:
  zh-CN: 生成新密钥
  en: Generate

credential.dialog.title_new:
  zh-CN: 新建凭据
  en: New credential
credential.dialog.title_edit:
  zh-CN: 编辑凭据
  en: Edit credential
credential.dialog.create:
  zh-CN: 创建
  en: Create
credential.dialog.kind:
  zh-CN: 类型
  en: Type
credential.dialog.name:
  zh-CN: 名称
  en: Name
credential.dialog.name_placeholder:
  zh-CN: 例如 生产环境 root
  en: e.g. Production root
credential.dialog.user:
  zh-CN: 用户名
  en: Username
credential.dialog.password:
  zh-CN: 密码
  en: Password
credential.dialog.private_key:
  zh-CN: 私钥
  en: Private key
credential.dialog.key_text_placeholder:
  zh-CN: 粘贴私钥，以 -----BEGIN 开头
  en: Paste the private key, starting with -----BEGIN
credential.dialog.no_key_dir:
  zh-CN: 本地数据库没有打开，这次运行无法保存私钥
  en: The local database isn’t open, so ShellRS can’t keep private keys until it restarts
credential.dialog.kept_key:
  zh-CN: 这把私钥由 ShellRS 保存，删除凭据时会一起删除。
  en: ShellRS keeps this private key and deletes it along with the credential.
credential.dialog.algorithm:
  zh-CN: 算法
  en: Algorithm
credential.dialog.rsa_note:
  zh-CN: 只在服务器不支持 Ed25519 时选它（OpenSSH 6.5 以前）。
  en: Choose it only for servers without Ed25519 support (OpenSSH before 6.5).
credential.dialog.public_key:
  zh-CN: 公钥
  en: Public key
credential.dialog.public_key_note:
  zh-CN: 把公钥加到服务器的 ~/.ssh/authorized_keys，就能用这把密钥登录。
  en: Add the public key to ~/.ssh/authorized_keys on a server to log in to it with this key.
credential.dialog.copy_public_key:
  zh-CN: 复制公钥
  en: Copy public key
credential.dialog.generating:
  zh-CN: 正在生成密钥…
  en: Generating the key…
credential.dialog.passphrase:
  zh-CN: 私钥口令
  en: Passphrase
credential.dialog.ask_for_passphrase:
  zh-CN: 留空则每次连接都询问
  en: Leave empty to be asked at each connection
credential.dialog.no_passphrase:
  zh-CN: 留空则不加密
  en: Leave empty to leave the key unencrypted
credential.dialog.agent_note:
  zh-CN: 登录时使用 SSH Agent（SSH_AUTH_SOCK 所指）中的密钥。
  en: Logs in with the keys in the SSH agent that SSH_AUTH_SOCK points to.
credential.dialog.agent_note_windows:
  zh-CN: 登录时使用 Windows 的 OpenSSH Authentication Agent 服务中的密钥。
  en: Logs in with the keys in the Windows OpenSSH Authentication Agent service.
credential.dialog.keychain_note:
  zh-CN: 密码和口令保存在系统钥匙串，不会写入 ShellRS 的数据库。
  en: Passwords and passphrases are kept in the system keychain, never in ShellRS’s database.
credential.dialog.no_keychain_note:
  zh-CN: 系统钥匙串不可用，这台机器上无法保存密码，每次连接都会询问。
  en: The system keychain isn’t available, so passwords can’t be saved on this computer and are asked for at each connection.
credential.dialog.drops_kept_key:
  zh-CN: 保存后，ShellRS 保存的原私钥会被删除。
  en: Saving deletes the private key ShellRS kept for this credential.
credential.dialog.usage.one:
  en: "%{count} host uses this credential."
credential.dialog.usage.other:
  zh-CN: 有 %{count} 台主机使用此凭据。
  en: "%{count} hosts use this credential."
credential.dialog.usage_new_key:
  zh-CN: 换成新私钥后，要把它的公钥加到这些主机上，它们才能再登录。
  en: After switching to a new private key, add its public key to these hosts so they can log in again.
credential.dialog.usage_reconnects:
  zh-CN: 修改用户名、类型或私钥文件后，其中已连接的主机会重新连接。
  en: Changing the username, type or private key file reconnects the ones that are connected.
credential.dialog.encrypting:
  zh-CN: 正在用口令加密私钥…
  en: Encrypting the private key with the passphrase…

credential.dialog.generate_failed:
  zh-CN: 无法生成密钥：%{error}
  en: "Couldn’t generate the key: %{error}"
credential.dialog.still_generating:
  zh-CN: 密钥还在生成，请稍候
  en: The key is still being generated. Try again in a moment.
credential.dialog.encode_failed:
  zh-CN: 无法保存私钥：%{error}
  en: "Couldn’t save the private key: %{error}"
credential.dialog.encrypt_failed:
  zh-CN: 无法加密私钥：%{error}
  en: "Couldn’t encrypt the private key: %{error}"
credential.dialog.key_not_saved:
  zh-CN: 私钥未能保存：%{error}
  en: "The private key wasn’t saved: %{error}"

credential.panel.title:
  zh-CN: 凭据
  en: Credentials
credential.panel.search:
  zh-CN: 搜索凭据
  en: Search credentials
credential.panel.detail.one:
  en: "%{summary} · %{count} host"
credential.panel.detail.other:
  zh-CN: "%{summary} · %{count} 台主机"
  en: "%{summary} · %{count} hosts"
credential.panel.no_matches:
  zh-CN: 没有匹配的凭据
  en: No matching credentials
credential.panel.empty:
  zh-CN: 还没有凭据
  en: No credentials yet
credential.panel.empty_hint:
  zh-CN: 保存一套用户名和密码、私钥或 SSH Agent，让多台主机共用。
  en: Save a username with a password, a private key or the SSH agent for several hosts to share.

credential.menu.new:
  zh-CN: 新建凭据…
  en: New credential…
credential.menu.generate:
  zh-CN: 生成密钥…
  en: Generate key…
credential.menu.edit:
  zh-CN: 编辑凭据…
  en: Edit credential…
credential.menu.copy_public_key:
  zh-CN: 复制公钥
  en: Copy public key
