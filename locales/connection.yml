_version: 2

# 连接: the questions a connection asks before it can go on.

connection.unknown_host.description:
  zh-CN: "主机：%{host}:%{port}\n算法：%{algorithm}\nSHA-256 指纹：%{fingerprint}\n\n请先确认该指纹来自可信渠道。"
  en: "Host: %{host}:%{port}\nAlgorithm: %{algorithm}\nSHA-256 fingerprint: %{fingerprint}\n\nMake sure the fingerprint matches one from a source you trust."
connection.unknown_host.jump_host_description:
  zh-CN: "跳板主机：%{jump_host}\n主机：%{host}:%{port}\n算法：%{algorithm}\nSHA-256 指纹：%{fingerprint}\n\n请先确认该指纹来自可信渠道。"
  en: "Jump host: %{jump_host}\nHost: %{host}:%{port}\nAlgorithm: %{algorithm}\nSHA-256 fingerprint: %{fingerprint}\n\nMake sure the fingerprint matches one from a source you trust."

connection.jump_host.instructions:
  zh-CN: 跳板主机「%{name}」
  en: Jump host “%{name}”
connection.jump_host.with_instructions:
  zh-CN: 跳板主机「%{name}」：%{instructions}
  en: "Jump host “%{name}”: %{instructions}"

connection.latency.timed_out:
  zh-CN: 超时
  en: Timed out
