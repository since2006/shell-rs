_version: 2

# 钥匙串: what the system keychain says when it fails.

secrets.unavailable:
  zh-CN: 系统钥匙串不可用，密码无法保存
  en: The system keychain isn’t available, so the password can’t be saved

secrets.keychain.open_failed:
  zh-CN: 打开系统钥匙串条目失败：%{reason}
  en: "Couldn’t open the system keychain entry: %{reason}"
secrets.keychain.read_failed:
  zh-CN: 读取系统钥匙串条目失败：%{reason}
  en: "Couldn’t read the system keychain entry: %{reason}"
secrets.keychain.write_failed:
  zh-CN: 写入系统钥匙串条目失败：%{reason}
  en: "Couldn’t write the system keychain entry: %{reason}"
secrets.keychain.delete_failed:
  zh-CN: 删除系统钥匙串条目失败：%{reason}
  en: "Couldn’t delete the system keychain entry: %{reason}"

secrets.keychain.no_store:
  zh-CN: 系统钥匙串不可用
  en: the system keychain isn’t available
secrets.keychain.no_access:
  zh-CN: 系统钥匙串被锁定或拒绝访问
  en: the system keychain is locked or denied access
secrets.keychain.bad_encoding:
  zh-CN: 已保存的内容不是有效的 UTF-8 文本
  en: what’s saved isn’t valid UTF-8 text
secrets.keychain.ambiguous.one:
  en: the keychain has %{count} entry with this name
secrets.keychain.ambiguous.other:
  zh-CN: 钥匙串里有 %{count} 条同名条目
  en: the keychain has %{count} entries with this name
secrets.keychain.too_long:
  zh-CN: 超过系统钥匙串 %{limit} 个字符的长度上限
  en: it’s longer than the system keychain’s limit of %{limit} characters
