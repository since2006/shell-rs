# Questions while connecting.
workspace.host_key.unknown_title:
  zh-CN: 首次连接此主机
  en: First connection to this host
workspace.host_key.trust:
  zh-CN: 信任并连接
  en: Trust and connect
workspace.host_key.changed_title:
  zh-CN: 服务器主机密钥已变更
  en: Server host key changed
workspace.host_key.changed:
  zh-CN: "主机：%{host}:%{port}\n算法：%{algorithm}\n已保存指纹：%{old}\n服务器当前指纹：%{fingerprint}\n\n连接已阻断。请核验服务器身份后手动处理：%{path}"
  en: "Host: %{host}:%{port}\nAlgorithm: %{algorithm}\nSaved fingerprint: %{old}\nServer’s fingerprint now: %{fingerprint}\n\nThe connection was blocked. Verify the server’s identity, then sort it out by hand in %{path}"
workspace.host_key.changed_via_jump_host:
  zh-CN: "跳板主机：%{jump_host}\n主机：%{host}:%{port}\n算法：%{algorithm}\n已保存指纹：%{old}\n服务器当前指纹：%{fingerprint}\n\n连接已阻断。请核验服务器身份后手动处理：%{path}"
  en: "Jump host: %{jump_host}\nHost: %{host}:%{port}\nAlgorithm: %{algorithm}\nSaved fingerprint: %{old}\nServer’s fingerprint now: %{fingerprint}\n\nThe connection was blocked. Verify the server’s identity, then sort it out by hand in %{path}"
workspace.auth.title:
  zh-CN: SSH 认证
  en: SSH authentication
workspace.auth.continue:
  zh-CN: 继续
  en: Continue

