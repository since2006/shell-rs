# Changes not saved yet, which a close or a quit would lose. `files` is
# one of the workspace.files phrases.
workspace.files.single:
  zh-CN: “%{name}”
  en: “%{name}”
workspace.files.pair:
  zh-CN: “%{first}”和“%{second}”
  en: “%{first}” and “%{second}”
workspace.files.several:
  zh-CN: “%{first}”等 %{count} 个文件
  en: "%{count} files including “%{first}”"
workspace.unsaved.quit_title:
  zh-CN: 退出 ShellRS？
  en: Quit ShellRS?
workspace.unsaved.quit:
  zh-CN: "%{files}有未保存的修改，退出后会丢失。"
  en: Unsaved changes to %{files} will be lost.
workspace.unsaved.discard_and_quit:
  zh-CN: 放弃修改并退出
  en: Discard changes and quit
workspace.unsaved.close_tabs_title.one:
  en: Close 1 tab?
workspace.unsaved.close_tabs_title.other:
  zh-CN: 关闭 %{count} 个标签？
  en: Close %{count} tabs?
workspace.unsaved.close_tabs:
  zh-CN: "%{files}有未保存的修改，关闭后会丢失。"
  en: Unsaved changes to %{files} will be lost.
workspace.unsaved.close_sftp_title:
  zh-CN: 关闭 SFTP 标签？
  en: Close the SFTP tab?
workspace.unsaved.close_sftp:
  zh-CN: "%{files}有未保存的修改，关闭 SFTP 标签会一起关掉它们，修改会丢失。"
  en: Closing the SFTP tab also closes %{files}. Unsaved changes will be lost.
workspace.unsaved.discard_and_close:
  zh-CN: 放弃修改并关闭
  en: Discard changes and close

# Terminal notices: the tab first, so a notice says which terminal it is
# from.
workspace.notice.titled:
  zh-CN: "%{tab}：%{title}"
  en: "%{tab}: %{title}"
workspace.notice.bell:
  zh-CN: "%{tab}：响铃"
  en: "%{tab}: Bell"

workspace.credential.public_key_copied:
  zh-CN: 已复制公钥
  en: Copied the public key
workspace.credential.public_key_unreadable:
  zh-CN: 无法从 %{path} 读出公钥
  en: Couldn’t read a public key from %{path}
workspace.credential.in_use_then_password.one:
  en: 1 host uses this credential. Once it’s deleted, that host switches to Password, asks for the password when connecting, and keeps its username.
workspace.credential.in_use_then_password.other:
  zh-CN: 有 %{count} 台主机正在使用此凭据。删除后它们改为「密码」，连接时询问密码，用户名不变。
  en: "%{count} hosts use this credential. Once it’s deleted, they switch to Password, ask for the password when connecting, and keep their usernames."
workspace.credential.in_use_then_no_password.one:
  en: 1 host uses this credential. Once it’s deleted, that host switches to No password, signs in with the SSH agent and the private keys in ~/.ssh, and keeps its username.
workspace.credential.in_use_then_no_password.other:
  zh-CN: 有 %{count} 台主机正在使用此凭据。删除后它们改为「无密码」，用 SSH Agent 和 ~/.ssh 中的私钥登录，用户名不变。
  en: "%{count} hosts use this credential. Once it’s deleted, they switch to No password, sign in with the SSH agent and the private keys in ~/.ssh, and keep their usernames."

workspace.forward.needs_host:
  zh-CN: 端口转发经由一台主机的 SSH 连接，请先新建主机。
  en: A port forward runs over a host’s SSH connection. Create a host first.
workspace.forward.delete_running:
  zh-CN: 这条转发正在运行，会先停止。
  en: This forward is running and will be stopped first.
workspace.forward.stopped:
  zh-CN: 端口转发“%{title}”已停止
  en: Port forward “%{title}” stopped
workspace.forward.prompt_origin:
  zh-CN: 端口转发“%{title}”正在通过 %{host} 连接。
  en: Port forward “%{title}” is connecting through %{host}.

workspace.snippets.delete_category.one:
  en: The 1 snippet in the category is deleted with it.
workspace.snippets.delete_category.other:
  zh-CN: 分类里的 %{count} 个片段会一起删除。
  en: The %{count} snippets in the category are deleted with it.

workspace.update.done_title:
  zh-CN: 更新完成
  en: Update complete
workspace.update.done:
  zh-CN: ShellRS 已更新到 %{version}。
  en: ShellRS is now %{version}.
workspace.update.failed_title:
  zh-CN: 更新没有完成
  en: Update not completed
workspace.update.failed:
  zh-CN: 没有装上 %{to}，ShellRS 仍是 %{from}。可以到官网下载安装。
  en: "%{to} wasn’t installed, so ShellRS is still %{from}. You can download it from the website."
