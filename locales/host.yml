host.import.note.ssh_config:
  zh-CN: 列出 Host 行里写明名称的主机，通配符条目里的设置会带上。ProxyJump 和 ProxyCommand 不导入，主机按直接连接导入；Match 块不读。
  en: Lists the hosts named on Host lines, with the settings of the wildcard entries that match them. ProxyJump and ProxyCommand aren’t imported, so the hosts connect directly; Match blocks are skipped.
host.import.note.known_hosts:
  zh-CN: 列出连接过的主机。known_hosts 里没有用户名，都填 root。
  en: Lists the hosts you’ve connected to. known_hosts has no usernames, so each one is set to root.
