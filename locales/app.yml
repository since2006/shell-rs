app.shortcut_refusal.needs_modifier_mac:
  zh-CN: 快捷键要带 ⌘、⌥ 或 ⌃，或者使用 F1–F12。
  en: A shortcut needs ⌘, ⌥ or ⌃, or one of F1–F12.
app.shortcut_refusal.needs_modifier:
  zh-CN: 快捷键要带 Ctrl 或 Alt，或者使用 F1–F12。
  en: A shortcut needs Ctrl or Alt, or one of F1–F12.
app.shortcut_refusal.needs_digit_mac:
  zh-CN: 这一项要按带修饰键的数字 1，例如 ⌘1。
  en: Press the digit 1 with a modifier, such as ⌘1.
app.shortcut_refusal.needs_digit:
  zh-CN: 这一项要按带修饰键的数字 1，例如 Alt+1。
  en: Press the digit 1 with a modifier, such as Alt+1.
app.shortcut_refusal.used_by:
  zh-CN: "%{keys} 已用于「%{label}」。"
  en: "%{keys} is already used by “%{label}”."
app.shortcut_refusal.reserved:
  zh-CN: "%{keys} 已被输入框等内置功能使用。"
  en: "%{keys} is used by text fields and other built-in features."
app.shortcut_refusal.unavailable:
  zh-CN: "%{keys} 不能用作全局快捷键，可能已被其他程序占用。"
  en: "%{keys} can’t be used system-wide. Another app may be using it."
