_version: 2

# Connecting
ssh.connect.failed:
  zh-CN: 无法建立 SSH 连接，请检查地址、端口和主机密钥
  en: Couldn’t establish an SSH connection (check the address, port and host key)
ssh.connect.cancelled:
  zh-CN: 连接已取消
  en: Connection cancelled

# Jump hosts
ssh.jump.deleted:
  zh-CN: 第 %{number} 台跳板主机已被删除，请编辑这台主机的连接方式
  en: Jump host %{number} was deleted. Edit how this host connects
ssh.jump.failed:
  zh-CN: 跳板主机「%{name}」：%{reason}
  en: "Jump host “%{name}”: %{reason}"
ssh.jump.none:
  zh-CN: 没有可用的跳板主机
  en: No jump hosts to connect through
ssh.jump.forward.connect_failed:
  zh-CN: 跳板主机「%{name}」无法连接到 %{host}:%{port}：连接失败
  en: "Jump host “%{name}” couldn’t connect to %{host}:%{port}: connection failed"
ssh.jump.forward.prohibited:
  zh-CN: 跳板主机「%{name}」无法连接到 %{host}:%{port}：服务器不允许端口转发
  en: "Jump host “%{name}” couldn’t connect to %{host}:%{port}: the server doesn’t allow port forwarding"
ssh.jump.forward.channel_failed:
  zh-CN: 跳板主机「%{name}」无法连接到 %{host}:%{port}：无法打开转发通道
  en: "Jump host “%{name}” couldn’t connect to %{host}:%{port}: couldn’t open a forwarding channel"

# Proxy
ssh.proxy.connect_failed:
  zh-CN: 无法连接代理服务器 %{host}:%{port}：%{reason}
  en: "Couldn’t connect to the proxy at %{host}:%{port}: %{reason}"
ssh.proxy.bad_credentials:
  zh-CN: 代理服务器拒绝了用户名或密码
  en: The proxy rejected the username or password
ssh.proxy.auth_required:
  zh-CN: 代理服务器要求认证，请填写代理的用户名和密码
  en: The proxy requires authentication. Enter a username and password for it
ssh.proxy.forbidden:
  zh-CN: 代理服务器不允许连接到 %{target}
  en: The proxy doesn’t allow connections to %{target}
ssh.proxy.reply_too_long:
  zh-CN: 代理服务器的回复过长
  en: The proxy’s reply is too long
ssh.proxy.closed:
  zh-CN: 代理服务器没有回复就关闭了连接
  en: The proxy closed the connection without replying
ssh.proxy.http.bad_gateway:
  zh-CN: 代理服务器无法连接到 %{target}：连接失败（HTTP 502）
  en: "The proxy couldn’t connect to %{target}: connection failed (HTTP 502)"
ssh.proxy.http.gateway_timeout:
  zh-CN: 代理服务器无法连接到 %{target}：连接超时（HTTP 504）
  en: "The proxy couldn’t connect to %{target}: timed out (HTTP 504)"
ssh.proxy.http.refused:
  zh-CN: 代理服务器拒绝了连接：%{status}
  en: "The proxy refused the connection: %{status}"
ssh.proxy.http.unrecognized:
  zh-CN: 代理服务器的回复无法识别，请确认它是 HTTP 代理
  en: The proxy’s reply wasn’t understood. Check that it’s an HTTP proxy
ssh.proxy.socks.unrecognized:
  zh-CN: 代理服务器的回复无法识别，请确认它是 SOCKS5 代理
  en: The proxy’s reply wasn’t understood. Check that it’s a SOCKS5 proxy
ssh.proxy.socks.credentials_too_long:
  zh-CN: 代理的用户名或密码太长，SOCKS5 最多 255 个字节
  en: The proxy username or password is too long. SOCKS5 allows at most 255 bytes
ssh.proxy.socks.no_password_auth:
  zh-CN: 代理服务器不接受用户名和密码认证
  en: The proxy doesn’t accept username and password authentication
ssh.proxy.socks.host_too_long:
  zh-CN: 主机名太长，SOCKS5 最多 255 个字节
  en: The hostname is too long. SOCKS5 allows at most 255 bytes
ssh.proxy.socks.rules_forbid:
  zh-CN: 代理服务器的规则不允许连接到 %{target}
  en: The proxy’s rules don’t allow connections to %{target}
ssh.proxy.socks.network_unreachable:
  zh-CN: 代理服务器无法连接到 %{target}：网络不可达
  en: "The proxy couldn’t connect to %{target}: network unreachable"
ssh.proxy.socks.host_unreachable:
  zh-CN: 代理服务器无法连接到 %{target}：主机不可达
  en: "The proxy couldn’t connect to %{target}: host unreachable"
ssh.proxy.socks.refused:
  zh-CN: 代理服务器无法连接到 %{target}：连接被拒绝
  en: "The proxy couldn’t connect to %{target}: connection refused"
ssh.proxy.socks.timeout:
  zh-CN: 代理服务器无法连接到 %{target}：连接超时
  en: "The proxy couldn’t connect to %{target}: timed out"
ssh.proxy.socks.internal:
  zh-CN: 代理服务器无法连接到 %{target}：代理服务器内部错误
  en: "The proxy couldn’t connect to %{target}: internal proxy error"
ssh.proxy.socks.no_connect:
  zh-CN: 代理服务器不支持 CONNECT 命令
  en: The proxy doesn’t support the CONNECT command
ssh.proxy.socks.address_type:
  zh-CN: 代理服务器不支持这种地址类型
  en: The proxy doesn’t support this type of address

# A credential a connection without anyone to ask needed
ssh.missing.password_rejected:
  zh-CN: 用户名或密码错误
  en: Incorrect username or password
ssh.missing.password:
  zh-CN: 未填写密码
  en: No password entered
ssh.missing.passphrase_rejected:
  zh-CN: 私钥口令错误
  en: Incorrect private key passphrase
ssh.missing.passphrase:
  zh-CN: 私钥已加密，未填写口令
  en: The private key is encrypted and no passphrase was entered
ssh.missing.keyboard_interactive:
  zh-CN: 服务器要求键盘交互式认证，无法在测试中完成
  en: The server asks for keyboard-interactive authentication, which a test can’t complete
ssh.password_wanted:
  zh-CN: 服务器要求密码，「无密码」不会询问；请改用「密码」或「使用凭据」
  en: The server wants a password, and “No password” doesn’t ask for one. Choose “Password” or “Credential” instead

# Questions
ssh.prompt.view_closed:
  zh-CN: 连接视图已关闭
  en: The tab for this connection was closed
ssh.prompt.request_cancelled:
  zh-CN: 认证请求已取消
  en: Authentication request cancelled

# Known hosts
ssh.known_hosts.changed_while_saving:
  zh-CN: 保存主机密钥时发现信任文件已发生变化
  en: The known hosts file changed while the host key was being saved
ssh.known_hosts.write_failed:
  zh-CN: 无法写入主机信任文件：%{path}
  en: "Couldn’t write to the known hosts file: %{path}"
ssh.known_hosts.read_failed:
  zh-CN: 无法读取主机信任文件：%{path}
  en: "Couldn’t read the known hosts file: %{path}"
ssh.known_hosts.corrupt:
  zh-CN: 主机信任文件已损坏：%{path}
  en: "The known hosts file is damaged: %{path}"
ssh.known_hosts.unreadable:
  zh-CN: 主机信任文件已损坏或无法读取：%{path}
  en: "The known hosts file is damaged or unreadable: %{path}"

# Authentication
ssh.auth.methods_unknown:
  zh-CN: 无法查询服务器支持的认证方式
  en: Couldn’t ask the server which authentication methods it supports
ssh.auth.agent_rejected:
  zh-CN: 服务器未接受 SSH Agent 中的密钥
  en: The server didn’t accept the keys in the SSH agent
ssh.auth.agent_no_publickey:
  zh-CN: 服务器不接受公钥登录，无法使用 SSH Agent
  en: The server doesn’t accept public key logins, so the SSH agent can’t be used
ssh.auth.rsa_hash:
  zh-CN: 无法协商 RSA 签名算法
  en: Couldn’t agree on an RSA signature algorithm with the server
ssh.auth.key_failed:
  zh-CN: 私钥认证失败
  en: Private key authentication failed
ssh.auth.key_rejected:
  zh-CN: 服务器未接受指定的私钥
  en: The server didn’t accept the private key
ssh.auth.no_key_accepted:
  zh-CN: 服务器未接受 SSH Agent 和 ~/.ssh 中的任何私钥
  en: The server accepted none of the keys in the SSH agent or ~/.ssh
ssh.auth.password_failed:
  zh-CN: 密码认证失败
  en: Password authentication failed
ssh.auth.saved_password_rejected:
  zh-CN: 已保存的密码被服务器拒绝，请重新输入
  en: The server rejected the saved password. Enter it again
ssh.auth.enter_password:
  zh-CN: 请输入登录密码
  en: Enter the password to log in
ssh.auth.prompt_title:
  zh-CN: SSH 登录
  en: SSH login
ssh.auth.password_field:
  zh-CN: 密码
  en: Password
ssh.auth.failed:
  zh-CN: 认证失败：服务器未接受可用的认证方式
  en: "Authentication failed: the server accepted none of the available methods"
ssh.auth.cancelled:
  zh-CN: 认证已取消
  en: Authentication cancelled
ssh.auth.invalid_reply:
  zh-CN: 认证回复无效
  en: Invalid authentication reply
ssh.auth.keyboard_start_failed:
  zh-CN: 无法开始交互式认证
  en: Couldn’t start keyboard-interactive authentication
ssh.auth.keyboard_cancelled:
  zh-CN: 交互式认证已取消
  en: Keyboard-interactive authentication cancelled
ssh.auth.keyboard_failed:
  zh-CN: 交互式认证失败
  en: Keyboard-interactive authentication failed

# SSH agent
ssh.agent.unreachable:
  zh-CN: 无法连接 SSH Agent：%{reason}
  en: "Couldn’t connect to the SSH agent: %{reason}"
ssh.agent.empty:
  zh-CN: SSH Agent 中没有密钥，请先用 ssh-add 添加
  en: The SSH agent has no keys. Add one with ssh-add first
ssh.agent.unsigned:
  zh-CN: SSH Agent 拒绝了签名请求
  en: The SSH agent refused to sign
ssh.agent.hash:
  zh-CN: 无法协商 SSH Agent 签名算法
  en: Couldn’t agree on a signature algorithm for the SSH agent
ssh.agent.no_socket:
  zh-CN: 没有设置 SSH_AUTH_SOCK，也未发现可连接的 SSH Agent
  en: SSH_AUTH_SOCK isn’t set and no reachable SSH agent was discovered
ssh.agent.missing_socket:
  zh-CN: "%{path} 不存在"
  en: "%{path} doesn’t exist"
ssh.agent.no_response:
  zh-CN: 没有响应
  en: no response
ssh.agent.service_not_running:
  zh-CN: OpenSSH Authentication Agent 服务没有运行
  en: the OpenSSH Authentication Agent service isn’t running
ssh.agent.unsupported:
  zh-CN: 这个平台不支持
  en: not supported on this platform

# Private keys
ssh.key.not_chosen:
  zh-CN: 私钥认证需要选择私钥文件
  en: Choose a private key file to log in with a key
ssh.key.unreadable:
  zh-CN: 无法读取私钥文件：%{path}
  en: "Couldn’t read the private key file: %{path}"
ssh.key.saved_passphrase_rejected:
  zh-CN: 已保存的口令无法解开 %{path}，请重新输入
  en: The saved passphrase doesn’t unlock %{path}. Enter it again
ssh.key.enter_passphrase:
  zh-CN: 请输入 %{path} 的口令
  en: Enter the passphrase for %{path}
ssh.key.prompt_title:
  zh-CN: 私钥口令
  en: Private key passphrase
ssh.key.passphrase_field:
  zh-CN: 口令
  en: Passphrase
ssh.key.too_many_attempts:
  zh-CN: 私钥口令错误次数过多
  en: Too many incorrect passphrases

# Why a login failed
ssh.error.timeout:
  zh-CN: 连接超时
  en: Connection timed out
ssh.error.refused:
  zh-CN: 连接被拒绝，该端口上没有服务在监听
  en: "Connection refused: nothing is listening on that port"
ssh.error.unreachable:
  zh-CN: 主机不可达
  en: Host unreachable
ssh.error.connect_failed:
  zh-CN: 无法连接：%{error}
  en: "Couldn’t connect: %{error}"
ssh.error.no_common.kex:
  zh-CN: 无法建立 SSH 连接：和服务器没有共同的密钥交换算法，服务器支持的是 %{theirs}
  en: "Couldn’t establish an SSH connection: no key exchange algorithm in common with the server, which supports %{theirs}"
ssh.error.no_common.host_key:
  zh-CN: 无法建立 SSH 连接：和服务器没有共同的主机密钥算法，服务器支持的是 %{theirs}
  en: "Couldn’t establish an SSH connection: no host key algorithm in common with the server, which supports %{theirs}"
ssh.error.no_common.cipher:
  zh-CN: 无法建立 SSH 连接：和服务器没有共同的加密算法，服务器支持的是 %{theirs}
  en: "Couldn’t establish an SSH connection: no cipher in common with the server, which supports %{theirs}"
ssh.error.no_common.mac:
  zh-CN: 无法建立 SSH 连接：和服务器没有共同的消息校验（MAC）算法，服务器支持的是 %{theirs}
  en: "Couldn’t establish an SSH connection: no MAC algorithm in common with the server, which supports %{theirs}"
ssh.error.no_common.compression:
  zh-CN: 无法建立 SSH 连接：和服务器没有共同的压缩算法，服务器支持的是 %{theirs}
  en: "Couldn’t establish an SSH connection: no compression algorithm in common with the server, which supports %{theirs}"

# Connection test
ssh.test.runtime_failed:
  zh-CN: 无法启动连接测试：%{error}
  en: "Couldn’t start the connection test: %{error}"
ssh.test.unresolved:
  zh-CN: 无法解析主机 %{host}
  en: Couldn’t resolve %{host}
ssh.test.host_key_changed:
  zh-CN: 主机密钥与已保存的不一致，已阻止连接。请先核实服务器身份
  en: The host key doesn’t match the saved one, so the connection was blocked. Verify the server’s identity first
ssh.test.host_key_declined:
  zh-CN: 未信任该主机的密钥
  en: The host key wasn’t trusted

# Remote terminal
ssh.terminal.shell_only:
  zh-CN: 这个终端经由堡垒机打开，只能使用终端本身，不能另外执行命令
  en: This terminal was opened by a bastion host and can’t run commands beside the shell
ssh.terminal.runtime_failed:
  zh-CN: 无法启动 SSH 运行时
  en: Couldn’t start the SSH runtime
ssh.terminal.bridge_failed:
  zh-CN: 无法启动 SSH 命令桥接线程
  en: Couldn’t start the SSH command thread
ssh.terminal.session_failed:
  zh-CN: 无法创建 SSH 会话通道
  en: Couldn’t open an SSH session channel
ssh.terminal.pty_refused:
  zh-CN: 服务器拒绝创建终端
  en: The server refused to create a terminal
ssh.terminal.shell_refused:
  zh-CN: 服务器拒绝启动 Shell
  en: The server refused to start a shell
ssh.terminal.tab_closed:
  zh-CN: 终端标签页已关闭
  en: The terminal tab was closed
ssh.terminal.write_failed:
  zh-CN: 向远程终端写入失败
  en: Couldn’t write to the remote terminal
ssh.terminal.resize_failed:
  zh-CN: 调整远程终端尺寸失败
  en: Couldn’t resize the remote terminal

# Commands: beside the shell, and the external CLI’s exec
ssh.exec.channel_failed:
  zh-CN: 无法打开 SSH 通道
  en: Couldn’t open an SSH channel
ssh.exec.send_failed:
  zh-CN: 无法发送命令
  en: Couldn’t send the command
ssh.exec.refused:
  zh-CN: 服务器拒绝执行命令
  en: The server refused to run the command
ssh.exec.timeout:
  zh-CN: 命令超时
  en: The command timed out
ssh.exec.runtime_failed:
  zh-CN: 无法启动连接：%{error}
  en: "Couldn’t start the connection: %{error}"
ssh.exec.command_failed:
  zh-CN: 无法执行命令：%{error}
  en: "Couldn’t run the command: %{error}"
ssh.exec.aborted:
  zh-CN: 输出已无人接收，命令已放弃
  en: Nothing was reading the output, so the command was abandoned
ssh.exec.disconnected:
  zh-CN: 连接在命令结束前断开
  en: The connection closed before the command finished
ssh.exec.host_key_changed:
  zh-CN: "%{endpoint} 的主机密钥与已保存的不一致，已拒绝连接。请先核实服务器身份"
  en: The host key of %{endpoint} doesn’t match the saved one, so the connection was refused. Verify the server’s identity first
ssh.exec.host_key_unknown:
  zh-CN: 尚未信任 %{endpoint} 的主机密钥：请先在 ShellRS 中连接一次这台主机
  en: The host key of %{endpoint} isn’t trusted yet. Connect to this host in ShellRS once first
ssh.exec.no_saved_password:
  zh-CN: 这台主机没有保存密码：请先在 ShellRS 中连接一次这台主机并保存密码
  en: This host has no saved password. Connect to it in ShellRS once and save the password
ssh.exec.saved_password_rejected:
  zh-CN: 保存的密码被服务器拒绝：请先在 ShellRS 中连接一次这台主机并保存密码
  en: The server rejected the saved password. Connect to this host in ShellRS once and save the right one
ssh.exec.no_saved_passphrase:
  zh-CN: 私钥已加密，但没有保存口令：请先在 ShellRS 中连接一次这台主机并保存密码
  en: The private key is encrypted and has no saved passphrase. Connect to this host in ShellRS once and save it
ssh.exec.saved_passphrase_rejected:
  zh-CN: 保存的私钥口令不正确：请先在 ShellRS 中连接一次这台主机并保存密码
  en: The saved private key passphrase is incorrect. Connect to this host in ShellRS once and save the right one
ssh.exec.keyboard_interactive:
  zh-CN: 服务器在键盘交互式认证中提出了密码以外的问题（如验证码），外部 CLI 无法回答
  en: The server asks keyboard-interactive questions besides the password (such as a verification code), which the external CLI can’t answer
