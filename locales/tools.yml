  en: Monitor

# Shared by the tools.
tools.refresh:
  zh-CN: 刷新
  en: Refresh
tools.reading:
  zh-CN: 正在读取…
  en: Loading…
tools.read_failed:
  zh-CN: 读取失败：%{error}
