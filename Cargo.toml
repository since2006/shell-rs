[package]
name = "shellr"
version = "0.1.0"
edition = "2024"
publish = false
description = "SSH session manager with local terminal support"

[dependencies]
gpui-kit = "0.6.1"
alacritty_terminal = "0.26"
anyhow = "1"
async-channel = "2"
dirs = "6"
futures = "0.3"
portable-pty = "0.9"
russh = "0.63"
russh-sftp = "=3.0.0"
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["fs", "io-util", "net", "rt", "sync", "time"] }
unicode-width = "0.2"
zeroize = "1"
keyring = "4"
trash = "5"

[dev-dependencies]
tokio = { version = "1", features = ["process", "test-util"] }
gpui-kit = { version = "0.6.1", features = ["test-support"] }
tempfile = "3"

# Optimize the rendering stack in debug builds (per gpui-kit's installation
# guide); shellr itself stays unoptimized and debuggable.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-macos = { opt-level = 3 }
gpui-base = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
cosmic-text = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
swash = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
resvg = { opt-level = 3 }
usvg = { opt-level = 3 }
zed-font-kit = { opt-level = 3 }
