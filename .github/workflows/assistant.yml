# The AI assistant's core (crates/shellrs-assistant), on its own: it builds
# without GPUI, so this takes minutes. Its tests also run with the app's
# (`cargo test`), and on Windows (windows.yml). They never reach a model
# service: a scripted transport answers. The `testing` feature holds the
# script the app's tests use.
name: assistant

on:
  push:
    branches: ["**"]
    paths:
      - "crates/shellrs-assistant/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/assistant.yml"
  workflow_dispatch:

jobs:
  assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml picks the toolchain; this installs it with the
      # components it lists before the cache key is computed.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -p shellrs-assistant --check
      - run: cargo clippy -p shellrs-assistant --all-targets -- -D warnings
      - run: cargo clippy -p shellrs-assistant --all-targets --features testing -- -D warnings
      - run: cargo test --locked -p shellrs-assistant
