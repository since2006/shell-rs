# The Windows build, which the Macs this is developed on cannot compile:
# the whole workspace through clippy, the external CLI's tests, including
# the named pipe between two processes, the updater's, the local SFTP pane's
# paths (std canonicalizes to `\\?\C:\…` there), the SSH core's but for
# the SFTP engine's, and the sync crate's, whose folder store replaces files
# the Windows way.
#
# A push runs it only when it touches code that differs on Windows (the
# files with `cfg(windows)` and friends, and the portable copy's), the
# build script or the dependencies. Windows code added to another file goes
# in this list too; until then, run it by hand (Actions › windows › Run
# workflow). Tags never run it: the release workflow builds Windows itself.
name: windows

on:
  push:
    branches: ["**"]
    paths:
      - "src/cli/**"
      - "src/analytics/**"
      - "src/update/**"
      - "src/app/mod.rs"
      - "src/app/paths.rs"
      - "src/app/computer.rs"
      - "crates/shellrs-hosts/Cargo.toml"
      - "crates/shellrs-hosts/src/private_key.rs"
      - "src/app/window_hiding.rs"
      - "src/app/system_hotkey.rs"
      - "src/main.rs"
      - "src/bin/**"
      - "crates/shellrs-ssh/Cargo.toml"
      - "crates/shellrs-ssh/src/connection.rs"
      - "crates/shellrs-ssh/src/probe.rs"
      - "src/ssh/transport.rs"
      - "tests/ui/connection.rs"
      - "crates/shellrs-ssh/src/sftp/download.rs"
      - "crates/shellrs-ssh/src/sftp/journal.rs"
      - "crates/shellrs-ssh/src/sftp/model.rs"
      - "crates/shellrs-ssh/src/sftp/upload.rs"
      - "crates/shellrs-ssh/src/sftp/sync.rs"
      - "crates/shellrs-ssh/src/sftp/tests.rs"
      - "src/sftp/local.rs"
      - "src/credential/credential_dialog.rs"
      - "src/settings/model.rs"
      - "src/settings/settings_panel.rs"
      - "src/terminal/local_shell.rs"
      - "src/terminal/local_pty.rs"
      - "src/project/project_panel.rs"
      - "src/terminal/zmodem.rs"
      - "src/serial/**"
      - "crates/shellrs-sync/**"
      - "src/app/shortcuts.rs"
      - "src/workspace/window_state.rs"
      - "src/testing.rs"
      - "tests/cli_bin.rs"
      - "build.rs"
      - ".cargo/config.toml"
      - "scripts/windows-runtime.ps1"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  # The same paths as a push: a pull request is tested the same way.
  pull_request:
    paths:
      - "src/cli/**"
      - "src/analytics/**"
      - "src/update/**"
      - "src/app/mod.rs"
      - "src/app/paths.rs"
      - "src/app/computer.rs"
      - "crates/shellrs-hosts/Cargo.toml"
      - "crates/shellrs-hosts/src/private_key.rs"
      - "src/app/window_hiding.rs"
      - "src/app/system_hotkey.rs"
      - "src/main.rs"
      - "src/bin/**"
      - "crates/shellrs-ssh/Cargo.toml"
      - "crates/shellrs-ssh/src/connection.rs"
      - "crates/shellrs-ssh/src/probe.rs"
      - "src/ssh/transport.rs"
      - "tests/ui/connection.rs"
      - "crates/shellrs-ssh/src/sftp/download.rs"
      - "crates/shellrs-ssh/src/sftp/journal.rs"
      - "crates/shellrs-ssh/src/sftp/model.rs"
      - "crates/shellrs-ssh/src/sftp/upload.rs"
      - "crates/shellrs-ssh/src/sftp/sync.rs"
      - "crates/shellrs-ssh/src/sftp/tests.rs"
      - "src/sftp/local.rs"
      - "src/credential/credential_dialog.rs"
      - "src/settings/model.rs"
      - "src/settings/settings_panel.rs"
      - "src/terminal/local_shell.rs"
      - "src/terminal/local_pty.rs"
      - "src/project/project_panel.rs"
      - "src/terminal/zmodem.rs"
      - "src/serial/**"
      - "crates/shellrs-sync/**"
      - "src/app/shortcuts.rs"
      - "src/workspace/window_state.rs"
      - "src/testing.rs"
      - "tests/cli_bin.rs"
      - "build.rs"
      - ".cargo/config.toml"
      - "scripts/windows-runtime.ps1"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:

jobs:
  cli:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml picks the toolchain; this installs it with the
      # components it lists before the cache key is computed.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # In case aws-lc-sys wants to assemble rather than use its prebuilt
      # objects.
      - uses: ilammy/setup-nasm@v1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: "cargo test --locked --lib ssh::"
      - run: "cargo test --locked -p shellrs-ssh -- --skip sftp::"
      - run: "cargo test --locked --test ui connection::"
      - run: "cargo test --lib cli::"
      - run: "cargo test --lib update::"
      - run: "cargo test --lib app::paths"
      - run: "cargo test --locked -p shellrs-hosts private_key::"
      - run: "cargo test --lib sftp::local::tests::local_listing"
      - run: "cargo test --lib terminal::local_shell"
      - run: "cargo test --lib serial::"
      - run: "cargo test --lib settings::model"
      - run: cargo test --test cli_bin
      # The programs cli_bin built start without the Visual C++ runtime.
      - run: ./scripts/windows-runtime.ps1 target/debug
        shell: pwsh
      - run: cargo test --locked -p shellrs-sync
