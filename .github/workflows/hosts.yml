# The hosts core (crates/shellrs-hosts), on its own: it builds without
# GPUI, so this takes minutes. Its tests also run with the app's (`cargo
# test`), and its private key files' on Windows (windows.yml). The
# `testing` feature holds the fixtures the app's tests use.
name: hosts

on:
  push:
    branches: ["**"]
    paths:
      - "crates/shellrs-hosts/**"
      # The cores it builds on.
      - "crates/shellrs-ssh/**"
      - "crates/shellrs-sync/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/hosts.yml"
  workflow_dispatch:

jobs:
  hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml picks the toolchain; this installs it with the
      # components it lists before the cache key is computed.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -p shellrs-hosts --check
      - run: cargo clippy -p shellrs-hosts --all-targets -- -D warnings
      - run: cargo clippy -p shellrs-hosts --all-targets --features testing -- -D warnings
      - run: cargo test --locked -p shellrs-hosts
